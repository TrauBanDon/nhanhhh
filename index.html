    // Self-healing for asset version mismatch (ChunkLoadError or 404 on scripts/links)
    (function () {
      function reload() {
        const RELOAD_KEY = 'av01_asset_fail_reload';
        const now = Date.now();
        const lastReload = parseInt(sessionStorage.getItem(RELOAD_KEY) || '0');
        // Max 1 reload per 30 seconds to prevent infinite loops if the server is actually down
        if (now - lastReload > 30000) {
          sessionStorage.setItem(RELOAD_KEY, now.toString());
          window.location.reload();
        }
      }

      // Catch failed <script> and <link> tags (e.g. hashed assets)
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {

          if (url && (url.includes('/assets/') || url.includes('/static/'))) {
            reload();
          }
        }
      }, true);

      // Catch failed dynamic imports (lazy loading)
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (e.reason.name === 'ChunkLoadError' || /Loading chunk|Failed to fetch dynamically imported module/.test(e.reason.message))) {
          reload();
        }
      });
    })();
